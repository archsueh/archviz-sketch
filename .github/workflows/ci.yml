name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Verify Consistency
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # One portable kit, one per-repo config — see archviz-diagram's ADR-003.
    # Five checks: version / SKILL.md byte budget / description routing surface
    # / count claims / CJK encoding. This repo had no CI at all before this.
    #
    # The `counts` check holds two claims, and the second is the interesting one:
    # the number of *implemented* rows in SKILL.md's style table must equal
    # STYLE_REGISTRY's length. The table carries one row (编辑排版) that nothing
    # implements, and it is marked so rather than deleted.
    - name: Verify Consistency Kit
      run: python3 scripts/check_archviz.py

    # A checker is only a gate if its own failure modes are tested.
    - name: Verify Consistency Kit Checker
      run: python3 scripts/check_archviz.py --self-test
